# The name shown in the top bar. Kubernetes has no reliable name for itself.
clusterName: ""

localCluster:
  # What Watson may do in the cluster the console runs in (Phase 6): read
  # runs reads only and refuses every change; write lets changes run once
  # someone approves them. Other clusters set this per connection.
  mode: read
  # With sign-in on, a change runs as the person who approved it, so their
  # own RBAC decides, and the console needs nothing more than impersonation.
  # With sign-in off (auth.mode none) and mode write, changes run as the
  # console's ServiceAccount: it is bound to this ClusterRole (the built-in
  # edit role: workloads, pods and their evictions, Secrets for Helm's
  # records, no RBAC) and to a small role to cordon, drain and label nodes.
  # Empty grants nothing, and the API server refuses the changes.
  writeClusterRole: edit

image:
  repository: ghcr.io/ucesys/221b
  # Defaults to the chart's appVersion, a release. CI also publishes main
  # and pr-<number>, which move to every new build, and sha-<commit>, which
  # names one build for good.
  tag: ""
  # A digest (sha256:...) pins one build whatever its tag points at; it
  # replaces the tag in the image reference.
  digest: ""
  # Empty picks Always for a moving tag (main, pr-7, latest), so every pod
  # start fetches the current build, and IfNotPresent for a release, a
  # sha- tag or a digest, which cannot change under their names. With a
  # moving tag the pod also restarts on every helm upgrade, so an upgrade
  # always runs the latest build of that tag. Set it to override.
  pullPolicy: ""

imagePullSecrets: []

# Resource names default to <release>-221b; set this to use your own.
fullnameOverride: ""

# Host names people may use to reach the console, besides localhost, IP
# addresses and its Service's own DNS names, for example a proxy's. Any
# other name is refused, which stops DNS-rebinding pages from reading it
# through a port-forward.
allowedHosts: []

# Replicas (P7-02). One is enough for most clusters; two or more keep the
# console up while a node drains or a pod is replaced. The replicas share
# sign-ins, settings, accounts and connections through Kubernetes (so
# connections.store must be secrets), and elect one, through a Lease, to
# run Sherlock and Watson, whose conversations and approval cards live in
# its memory; the others pass those requests to it. Losing a replica costs
# its viewers a reconnect; losing the leader also loses open Sherlock
# conversations and Watson cards not yet run, as a restart does. With more
# than one, the chart adds a PodDisruptionBudget and spreads the pods over
# nodes.
replicaCount: 1

# How often every open console is updated: the server reads CPU and memory
# in use from metrics-server, rebuilds the rows that changed and sends every
# browser the same update at the same moment. Nodes and pods are watched,
# so the rate adds no load there. This is the starting value; the Settings
# dialog changes it for everyone and keeps the choice in the console's
# ConfigMap. 1s to 10m.
refresh: 3s
# Read each node's boot time from its kubelet, for the uptime in the node
# details. It is read through the API server's node proxy, once per node
# and boot, and needs get on nodes/proxy, which also lets the console's
# ServiceAccount reach the kubelets' other endpoints (stats, metrics, logs),
# and run a command in any pod through a kubelet's exec endpoint, which
# kubelets authorize as get on nodes/proxy. Turn it off where the console's
# own account must not be able to run anything (the read-only lock-down in
# the README). Off, the node details show how long the node has been Ready
# instead.
kubeletStats: true
# How often the API server is checked.
healthInterval: 10s
logLevel: info

# Sign-in (P3-01) and roles (Phase 6.1). Every page and API call needs a
# signed-in person, except the health probes and /metrics.
#
# There are four roles. Admin and Viewer apply in the namespaces a group is
# bound to; SuperAdmin and SuperViewer apply everywhere and are given in the
# console (a local user) or by a directory group (LDAP). Every binding is
# written here and rendered by this chart; nothing in the console or in
# Watson creates one, so a change of who may do what is a helm upgrade.
auth:
  # oidc: people sign in with an OpenID Connect provider (Okta, Entra ID,
  # Google, Keycloak, Dex, ...). ldap: with their directory account, and
  # only members of a group listed in auth.ldap.roles may sign in. local:
  # accounts kept by the console itself, for evaluations and clusters
  # without a provider. none: no sign-in, as before Phase 3; everyone who
  # reaches the console is an administrator, so expose it only on a network
  # where that is acceptable.
  mode: local
  # The names Kubernetes sees for people and groups from each source, so a
  # local "ops" and an LDAP "ops" are different subjects. OIDC names carry
  # auth.kubernetes.userPrefix and groupPrefix. Names that start with
  # system: or 221b: are never accepted from any source.
  prefixes:
    local: "221b-local:"
    ldap: "221b-ldap:"
  # An optional code that must be typed on the first-run page, which asks
  # for the first administrator while no user exists. Empty asks for none.
  # Or name an existing Secret holding it under the key setup-token.
  setupToken: ""
  setupTokenSecret: ""
  oidc:
    # The provider's issuer URL, where /.well-known/openid-configuration lives.
    issuer: ""
    clientID: ""
    # The client secret, or the name of an existing Secret holding it under
    # the key client-secret. Register https://<host>/signin/callback as the
    # client's redirect URI.
    clientSecret: ""
    existingSecret: ""
    # Scopes to ask for; add groups when the provider needs it to send them.
    scopes: "openid,profile,email"
    # The claim that names a person to Kubernetes RBAC and the audit log, and
    # the claim that lists their groups (nested claims use dots:
    # realm_access.roles).
    usernameClaim: email
    groupsClaim: groups
    # What the sign-in button says: "Sign in with Okta".
    providerName: ""
    # The callback URL as registered with the provider; empty derives it
    # from each request (https://<host>/signin/callback), which is right
    # behind an Ingress.
    redirectURL: ""
    # Groups of the provider for each role, as under auth.ldap.roles. With
    # none listed, every group in the token reaches Kubernetes by its own
    # name, as before, and auth.admins and auth.adminGroups are the
    # SuperAdmins. With some, only the listed groups do, and the console's
    # right to impersonate groups is limited to them.
    roles: {}
  ldap:
    # ldaps://host:636, or ldap://host:389 with startTLS: true. A plain
    # ldap:// URL without startTLS is refused: passwords would cross the
    # network in the clear.
    url: ""
    startTLS: false
    # An optional Secret holding the CA bundle that signed the server's
    # certificate, under the key ca.crt.
    caSecret: ""
    caSecretKey: ca.crt
    # The search account, and the Secret holding its password under the key
    # bind-password. The password is never in values.
    bindDN: ""
    existingSecret: ""
    # {username} is what the person typed, escaped. {dn} is the DN of the
    # person or group whose groups are being looked for.
    userSearch:
      baseDN: ""
      filter: "(uid={username})"
      usernameAttr: uid
      emailAttr: mail
      nameAttr: cn
    groupSearch:
      baseDN: ""
      filter: "(member={dn})"
      nameAttr: cn
      # Active Directory: member of a group is a DN under "member" and
      # nested groups are groups of groups; true resolves them.
      nested: true
    pageSize: 500
    # How often the Users page's list of people is read from the directory.
    syncInterval: 1h
    # The groups of each role, written as the directory has them. Any listed
    # group lets its members sign in. viewer and admin entries may carry
    # namespaces, which become RoleBindings; superViewer and superAdmin
    # apply everywhere and take none.
    roles: {}
    #  viewer:      [ { group: team-a-readers, namespaces: [web, api] } ]
    #  admin:       [ { group: team-a-ops,     namespaces: [web, api] } ]
    #  superViewer: [ { group: auditors } ]
    #  superAdmin:  [ { group: platform-admins } ]
  local:
    # Groups for local users: a name, a role (viewer or admin) and the
    # namespaces it is bound to. Who is in a group is kept in the console
    # (the Users page, or groups below) and changes without an upgrade.
    groups: []
    #  - { name: web-readers,  role: viewer, namespaces: [web] }
    #  - { name: checkout-ops, role: admin,  namespaces: [checkout, web] }
    # Accounts, with passwords as hashes. Make a hash with
    #   kubectl run hash --rm -it --restart=Never --image=ghcr.io/ucesys/221b:main -- hash-password
    # (type the password, then Ctrl-D, at least 12 characters), or
    # docker run --rm -i <image> hash-password.
    # Or name an existing Secret holding the list under the key users.yaml.
    # Accounts made in the console are kept in a Secret of this namespace
    # (with connections.store secrets); these stay read-only there.
    users: []
    #  - email: ops@corp.example
    #    name: Ops
    #    roles: [superAdmin]          # superAdmin and/or superViewer
    #    groups: [checkout-ops]       # names of auth.local.groups
    #    passwordHash: pbkdf2-sha256$600000$...
    existingSecret: ""
  # Who manages cluster connections and the settings (P3-03): the
  # SuperAdmins that are not made in the console. Usernames (the username
  # claim, an email for local accounts) and groups. With LDAP, list the
  # directory's SuperAdmin groups under auth.ldap.roles.superAdmin instead.
  admins: []
  adminGroups: []
  # A session ends after this long without a request, and this long after
  # sign-in whatever happens.
  sessionIdle: 8h
  sessionMax: 168h
  # What each person sees is what Kubernetes lets them see (P3-02): the
  # console reads logs and YAML as them, by impersonation, and asks
  # Kubernetes, per namespace, whether they may list what each tab shows.
  # Set the prefixes the API servers add to OIDC names (--oidc-username-prefix,
  # --oidc-groups-prefix) so the console names OIDC people the same way. The
  # answers are kept for accessTTL; a change of groups reaches people within
  # it, in open sessions too.
  kubernetes:
    userPrefix: ""
    groupPrefix: ""
    accessTTL: 2m

# The audit log (P3-10): every sign-in, sign-out, settings and connection
# change is one JSON line on the console's standard output (kubectl logs),
# naming the person. A webhook receives the same records as JSON POSTs.
audit:
  webhook:
    url: ""
    # A bearer token sent with each POST, or an existing Secret holding it
    # under the key token.
    token: ""
    existingSecret: ""

# Publish the console through an Ingress (P3-11). With TLS, plain HTTP is
# redirected to HTTPS and the session cookie is marked Secure.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: console.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    # A Secret with the certificate and key, or leave empty for a default
    # certificate the Ingress controller or cert-manager provides.
    secretName: ""

# Other clusters (P3-04 to P3-09). An administrator adds them in the
# console; each connection is kept as a Secret in the release namespace,
# named <release>-cluster-<id>, and the console's Role may manage Secrets
# there (and only there). store: memory keeps them in memory instead,
# losing them on restart, and grants nothing on Secrets.
connections:
  store: secrets

sherlock:
  # Sherlock answers questions about a cluster through the Claude API
  # (Phase 5). It is off for every cluster until an administrator turns it
  # on in Settings and gives it an API key, which the console keeps in a
  # Secret of its own namespace (<release>-sherlock) with connections.store
  # secrets, otherwise in memory until a restart. Nothing is sent to the
  # API for a cluster where it is off.
  apiURL: https://api.anthropic.com
  # Another model API, or an enterprise gateway in front of one. Empty is
  # the Claude API at apiURL; an administrator can change it in Settings
  # unless lockProvider is true. For example:
  #   provider: {kind: openai, endpoint: https://ai-gateway.corp.example/v1}
  #   provider: {kind: bedrock, region: eu-west-1}
  #   provider: {kind: vertex, region: europe-west1, project: my-project}
  # kind is anthropic, openai (Chat Completions: OpenAI, Azure OpenAI,
  # Gemini, vLLM, Ollama, LiteLLM, …), bedrock or vertex. Optional: endpoint,
  # auth (header, aws, google or none), authHeader and authPrefix (such as
  # api-key, or Authorization with "Bearer "), headers (not secret), query
  # (such as api-version=2024-10-21), region, project, and caCert (a PEM
  # bundle for a gateway with a private CA). Bedrock and Vertex use the
  # ServiceAccount's cloud identity (serviceAccount.annotations for IRSA or
  # Workload Identity) when no credential is saved. A gateway on a port
  # other than 443 also needs networkPolicy.outboundPorts.
  provider: {}
  # Keep administrators from changing the provider in Settings.
  lockProvider: false
  # Or take the key from a Secret you manage; the Settings then show it as
  # set by the chart and cannot change it.
  existingSecret: ""
  existingSecretKey: api-key
  # Allow the console's network policy to reach the Claude API (HTTPS).
  egress: true

secrets:
  # Read Secrets. The Namespaces tab then lists each Secret with its key
  # names and sizes, and the Helm tab reads release records, which Helm
  # keeps in Secrets. The server keeps only key names and sizes, the
  # public facts of a kubernetes.io/tls Secret's certificate (its names,
  # issuer and validity, for the Networks tab; never tls.key), and the
  # decoded release records with credential-like values masked: a Secret's
  # values never reach a browser, an export or a log. Off, the console's
  # ClusterRole and the Viewer and Admin roles grant nothing on Secrets,
  # the Namespaces tab lists no Secrets, the YAML view refuses them, the
  # Helm tab is hidden and the Networks tab doesn't check certificates.
  # Two grants stay: the console's Role on the Secrets of its own namespace
  # (its connections, unless connections.store is memory), and SuperAdmin,
  # whose definitions both read every Secret (make people SuperViewers to
  # withhold Secrets).
  read: true
  # Let Admins and SuperAdmins see a Secret's values (Phase 10): on the
  # Namespaces tab a Secret's keys gain a Reveal button, which shows one
  # value at a time, read live as the person and written to the audit
  # log; the cache, exports, logs and Sherlock still never hold a value.
  # Off, Admins and SuperAdmins can still edit a Secret, but blind: they
  # type new values without seeing the old ones.
  reveal: false

toolbox:
  # The Toolbox (Phase 9, docs/toolbox.md): the Tools menu beside each pod
  # and node opens a shell, runs one command, forwards a port, adds a
  # debug container, starts a debug pod, or opens a shell on a node. Each
  # is a Watson card first (approved by a second person on production, and
  # by a second SuperAdmin for anything on a node), then a session in the
  # Dock that runs as the person who asked, with their roles: the roles
  # decide who may use what (rbac.roles.admin.exec below); these values
  # are the ceiling the console never exceeds.
  enabled: true
  # No keystrokes, output or forwarded bytes for this long ends a session.
  idleTimeout: 10m
  # The hard limit, unless the card approved a shorter one.
  maxDuration: 60m
  # none, or pvc: keep each terminal session's transcript (asciicast v2,
  # what was typed and shown, Secrets included) on a volume, downloadable
  # by its owner and SuperAdmins for retention. Port forwards keep
  # connections and bytes only.
  transcripts: none
  transcriptsVolume:
    size: 5Gi
    storageClass: ""
    # ReadWriteMany with more than one replica.
    accessMode: ReadWriteOnce
  retention: 400d
  history:
    # Ended sessions kept for Administration › Sessions.
    keep: 300
  shell:
    enabled: true
    oneCommand: true
    fileTransfer: true
    quickCommands:
      - env
      - cat /proc/1/limits
      - ss -tlnp
  portForward:
    enabled: true
    # Older 221b commands are refused with an upgrade message.
    cliMinVersion: 0.8.0
  debugContainer:
    enabled: true
    # Mount the target container's volumes in the debug container.
    mountVolumes: true
    images: [general, network]
  debugPod:
    enabled: true
    ttlAfterFinished: 10m
    profiles: [general, network]
  nodeShell:
    # Needs rbac.roles.superAdmin.template full; with readOnly the namespace
    # is not created and the tool is off.
    enabled: true
    # Created by the chart at Pod Security privileged. Empty: the release's
    # namespace with -privileged (221b-privileged for a console in 221b),
    # so a second console in the cluster gets a namespace of its own.
    namespace: ""
    image: node
    profiles: [general, netadmin, sysadmin]
    # cluster: the cluster's two-person rule, as for other tools; a node
    # shell opens at once elsewhere. always: a second SuperAdmin approves
    # every node shell, on every cluster.
    approval: cluster
    quickCommands:
      - journalctl -u kubelet -n 200 --no-pager
      - df -h /var/lib/containerd /var/log /
      - crictl ps -a --state exited
      - dmesg -T | tail -n 100
  # The images the tools may run, and nothing else. Pin them by digest
  # (busybox:1.37@sha256:…) for production; a new image is a chart upgrade.
  # caps are added only where the namespace's Pod Security level allows.
  images:
    general:
      image: busybox:1.37
      tools: sh, ls, cat, tar, wget, nc
    network:
      image: nicolaka/netshoot:v0.14
      caps: [NET_RAW, NET_ADMIN]
      tools: dig, curl, tcpdump, iperf, nmap, ss
    node:
      image: ubuntu:24.04
      tools: the node's own tools through /host

serviceAccount:
  create: true
  # Defaults to the full name.
  name: ""
  annotations: {}

rbac:
  # Creates the console's own ClusterRole and Role, and the four roles for
  # people (Viewer, SuperViewer, Admin, SuperAdmin; ClusterRoles named
  # 221b-viewer, 221b-super-viewer, 221b-admin and 221b-super-admin) with
  # their bindings. Those names are fixed, one set per cluster: a second
  # console, in another namespace, leaves the ones another release installed
  # and uses them (it asks the cluster at install and upgrade, so helm
  # template always renders them).
  #
  # The console's ClusterRole is read-only: get, list and
  # watch on the kinds the tabs show (nodes, namespaces, pods, workloads,
  # Services and their endpoints, Ingresses and IngressClasses, ConfigMaps,
  # PVCs, events, the namespace long tail, and for the analysis tabs roles
  # and bindings, NetworkPolicies, disruption budgets, quotas, limit
  # ranges, priority classes and admission webhook configurations), get on
  # pod logs, get and list on node and pod metrics, get on nodes/proxy when
  # kubeletStats is on, and get, list and watch on Secrets only when
  # secrets.read is on. With sign-in it may impersonate any user name
  # (Kubernetes cannot narrow that by rule, so the server alone decides
  # which name it sends; guard its token), only the groups listed in auth,
  # and create access reviews. A Role to get and
  # patch its own settings ConfigMap. It has no right on roles or
  # bindings, and no other writes, except Watson's with sign-in off and
  # localCluster.mode write (see localCluster.writeClusterRole).
  create: true
  # Which definition of the two roles that can change things is installed.
  # full: Admin may do the namespaced changes Watson supports, forward
  # ports and start debug pods (the Toolbox), and with admin.exec open
  # shells; SuperAdmin may do everything. readOnly: the role exists, with no write verb, so
  # nobody can change anything through the console; the read-only
  # SuperAdmin lists and watches everything and gets everything except
  # the subresources that run a command or proxy to one (pods/exec,
  # pods/attach, pods/portforward, pods/proxy, services/proxy, nodes/proxy). Both readOnly with
  # localCluster.mode read is the fully protected read-only deployment; the
  # chart refuses to render both readOnly with localCluster.mode write.
  # Switching is a helm upgrade and changes no binding.
  roles:
    admin:
      template: full
      # The full Admin may also open shells and run commands in its
      # namespaces (create pods/exec). It already forwards ports and starts
      # debug pods; debug containers and node shells stay SuperAdmin's.
      exec: false
    superAdmin:
      template: full
  # strict: when a cluster's 221b roles allow more than the ones this chart
  # installs (someone edited them), the console refuses every change there
  # and says what differs. off only reports it, on the Permissions page and
  # in the audit log.
  enforce: "off"

service:
  # ClusterIP: open it with kubectl port-forward or an Ingress. LoadBalancer
  # or NodePort put it on the network: with a load balancer controller
  # (MetalLB, kube-vip, a cloud provider) a LoadBalancer gets an address
  # that answers on the port below; either type also opens a node port on
  # every node. Without TLS (an Ingress with tls, or a proxy that sets
  # X-Forwarded-Proto) sessions travel over plain HTTP.
  type: ClusterIP
  port: 8081
  # NodePort and LoadBalancer: the port opened on every node, 30000 to
  # 32767 unless the API server allows more. Empty lets Kubernetes pick.
  nodePort: null
  # LoadBalancer: which controller takes it, and an address to ask for.
  loadBalancerClass: ""
  loadBalancerIP: ""
  # Node addresses on which kube-proxy should also answer on the port, for
  # clusters without a load balancer controller: list every node's address
  # to reach the console on each node at the port above.
  externalIPs: []
  # Cluster: every node forwards to the console. Local: only the node
  # running it answers, but the console sees the client's real address.
  externalTrafficPolicy: Cluster
  annotations: {}

networkPolicy:
  enabled: true
  # Peers allowed to reach the console on its HTTP port, as NetworkPolicy
  # "from" entries. kubectl port-forward needs none. With a LoadBalancer or
  # NodePort Service an empty list allows every address, since that is
  # what exposing it means; list networks here to narrow it. With
  # ingress.enabled and a ClusterIP Service, list the Ingress controller
  # here (the chart refuses an empty list then, which would admit nothing),
  # for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  # The console connects to Kubernetes API servers, its own and the other
  # clusters' it shows, on these ports (6443 is where most API servers
  # listen behind the kubernetes Service; minikube uses 8443 and MicroK8s
  # 16443).
  apiServerPorts: [443, 6443]
  # The API servers' addresses, as CIDRs, to allow nothing else. Empty
  # allows any address on the ports above, since the addresses differ from
  # cluster to cluster and managed clusters change them. DNS is always
  # allowed, for the API servers given by name.
  apiServerCIDRs: []
  # With OIDC sign-in, an audit webhook or Sherlock (sherlock.egress) the
  # console also needs the provider's, webhook's or Claude API's HTTPS
  # port; it is allowed then. List CIDRs to narrow where it may connect
  # for them.
  outboundPorts: [443]
  outboundCIDRs: []

# The server keeps a watched copy of every node, pod, workload and Service,
# trimmed to what the tabs show; 1Gi holds 500 nodes and 15,000 pods with
# room to spare. It sizes its garbage collector to 90% of the memory limit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

# Where the pods may land. With more than one replica and none given, the
# pods are spread over nodes when there is room (a soft constraint).
topologySpreadConstraints: []
# With more than one replica, keeps them off each other's nodes as well:
# soft asks the scheduler to prefer a node without one, more strongly than
# the spread above; hard requires it, so a replica with no such node left
# stays Pending, and a rolling update needs one node more than
# replicaCount. Empty (the default) adds nothing. A podAntiAffinity in
# affinity below replaces it.
antiAffinity: ""
# How long a pod has to finish when it stops: it ends its event streams and,
# as the leader, hands Sherlock and Watson to another replica first.
terminationGracePeriodSeconds: 20
podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
