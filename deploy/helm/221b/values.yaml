# The name shown in the top bar. Kubernetes has no reliable name for itself.
clusterName: ""

image:
  repository: ghcr.io/ucesys/221b
  # Defaults to the chart's appVersion, a release. CI also publishes main
  # and pr-<number>, which move to every new build, and sha-<commit>, which
  # names one build for good.
  tag: ""
  # A digest (sha256:...) pins one build whatever its tag points at; it
  # replaces the tag in the image reference.
  digest: ""
  # Empty picks Always for a moving tag (main, pr-7, latest), so every pod
  # start fetches the current build, and IfNotPresent for a release, a
  # sha- tag or a digest, which cannot change under their names. With a
  # moving tag the pod also restarts on every helm upgrade, so an upgrade
  # always runs the latest build of that tag. Set it to override.
  pullPolicy: ""

imagePullSecrets: []

# Resource names default to <release>-221b; set this to use your own.
fullnameOverride: ""

# Host names people may use to reach the console, besides localhost, IP
# addresses and its Service's own DNS names, for example a proxy's. Any
# other name is refused, which stops DNS-rebinding pages from reading it
# through a port-forward.
allowedHosts: []

replicaCount: 1

# How often every open console is updated: the server reads CPU and memory
# in use from metrics-server, rebuilds the rows that changed and sends every
# browser the same update at the same moment. Nodes and pods are watched,
# so the rate adds no load there. This is the starting value; the Settings
# dialog changes it for everyone and keeps the choice in the console's
# ConfigMap. 1s to 10m.
refresh: 3s
# Read each node's boot time from its kubelet, for the uptime in the node
# details. It is read through the API server's node proxy, once per node
# and boot, and needs get on nodes/proxy, which also lets the console's
# ServiceAccount read the kubelets' other endpoints (stats, metrics, logs).
# Off, the node details show how long the node has been Ready instead.
kubeletStats: true
# How often the API server is checked.
healthInterval: 10s
logLevel: info

# Sign-in (P3-01). Every page and API call needs a signed-in person,
# except the health probes and /metrics.
auth:
  # oidc: people sign in with an OpenID Connect provider (Okta, Entra ID,
  # Google, Keycloak, Dex, ...). local: accounts kept by the console itself,
  # for evaluations and clusters without a provider. none: no sign-in, as
  # before Phase 3; everyone who reaches the console is an administrator,
  # so expose it only on a network where that is acceptable.
  mode: local
  oidc:
    # The provider's issuer URL, where /.well-known/openid-configuration lives.
    issuer: ""
    clientID: ""
    # The client secret, or the name of an existing Secret holding it under
    # the key client-secret. Register https://<host>/signin/callback as the
    # client's redirect URI.
    clientSecret: ""
    existingSecret: ""
    # Scopes to ask for; add groups when the provider needs it to send them.
    scopes: "openid,profile,email"
    # The claim that names a person to Kubernetes RBAC and the audit log, and
    # the claim that lists their groups (nested claims use dots:
    # realm_access.roles).
    usernameClaim: email
    groupsClaim: groups
    # What the sign-in button says: "Sign in with Okta".
    providerName: ""
    # The callback URL as registered with the provider; empty derives it
    # from each request (https://<host>/signin/callback), which is right
    # behind an Ingress.
    redirectURL: ""
  local:
    # Accounts, with passwords as hashes. Make a hash with
    #   kubectl run hash --rm -it --restart=Never --image=ghcr.io/ucesys/221b:main -- hash-password
    # (type the password, then Ctrl-D), or docker run --rm -i <image> hash-password.
    # Or name an existing Secret holding the list under the key users.yaml.
    users: []
    #  - email: ops@corp.example
    #    name: Ops
    #    groups: [platform-admins]
    #    passwordHash: pbkdf2-sha256$600000$...
    existingSecret: ""
  # Who manages cluster connections and the settings (P3-03): usernames
  # (the username claim, an email for local accounts) and groups.
  admins: []
  adminGroups: []
  # A session ends after this long without a request, and this long after
  # sign-in whatever happens.
  sessionIdle: 8h
  sessionMax: 168h
  # What each person sees is what Kubernetes lets them see (P3-02): the
  # console reads logs and YAML as them, by impersonation, and asks
  # Kubernetes, per namespace, whether they may list what each tab shows.
  # Write RBAC for them as users and groups, and set the prefixes the API
  # servers add to OIDC names (--oidc-username-prefix, --oidc-groups-prefix)
  # so the console names them the same way. The answers are kept for
  # accessTTL; an RBAC change reaches people within it.
  kubernetes:
    userPrefix: ""
    groupPrefix: ""
    accessTTL: 2m

# The audit log (P3-10): every sign-in, sign-out, settings and connection
# change is one JSON line on the console's standard output (kubectl logs),
# naming the person. A webhook receives the same records as JSON POSTs.
audit:
  webhook:
    url: ""
    # A bearer token sent with each POST, or an existing Secret holding it
    # under the key token.
    token: ""
    existingSecret: ""

# Publish the console through an Ingress (P3-11). With TLS, plain HTTP is
# redirected to HTTPS and the session cookie is marked Secure.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: console.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    # A Secret with the certificate and key, or leave empty for a default
    # certificate the Ingress controller or cert-manager provides.
    secretName: ""

# Other clusters (P3-04 to P3-09). An administrator adds them in the
# console; each connection is kept as a Secret in the release namespace,
# named <release>-cluster-<id>, and the console's Role may manage Secrets
# there (and only there). store: memory keeps them in memory instead,
# losing them on restart, and grants nothing on Secrets.
connections:
  store: secrets

preferences:
  # Keep each signed-in person's own preferences, such as the columns each
  # table shows, with their account, so they follow them to any browser.
  # They are kept in the settings ConfigMap, one key per person named by a
  # hash of their subject (16 KiB at most each). Off, or with sign-in off,
  # each browser keeps its own.
  perUser: true

sherlock:
  # Sherlock answers questions about a cluster through the Claude API
  # (Phase 5). It is off for every cluster until an administrator turns it
  # on in Settings and gives it an API key, which the console keeps in a
  # Secret of its own namespace (<release>-sherlock) with connections.store
  # secrets, otherwise in memory until a restart. Nothing is sent to the
  # API for a cluster where it is off.
  apiURL: https://api.anthropic.com
  # Or take the key from a Secret you manage; the Settings then show it as
  # set by the chart and cannot change it.
  existingSecret: ""
  existingSecretKey: api-key
  # Allow the console's network policy to reach the Claude API (HTTPS).
  egress: true

secrets:
  # Read Secrets. The Namespaces tab then lists each Secret with its key
  # names and sizes, and the Helm tab reads release records, which Helm
  # keeps in Secrets. The server keeps only key names and sizes, the
  # public facts of a kubernetes.io/tls Secret's certificate (its names,
  # issuer and validity, for the Networks tab; never tls.key), and the
  # decoded release records with credential-like values masked: a Secret's
  # values never reach a browser, an export or a log. Off, the ClusterRole
  # grants nothing on Secrets, the Namespaces tab lists no Secrets, the
  # YAML view refuses them, the Helm tab is hidden and the Networks tab
  # doesn't check certificates.
  read: true

serviceAccount:
  create: true
  # Defaults to the full name.
  name: ""
  annotations: {}

rbac:
  # A read-only ClusterRole: get, list and watch on the kinds the tabs show
  # (nodes, namespaces, pods, workloads, Services and their endpoints,
  # Ingresses and IngressClasses, ConfigMaps, PVCs, events, the namespace
  # long tail, and for the analysis tabs roles and bindings, NetworkPolicies,
  # disruption budgets, quotas, limit ranges, priority classes and admission
  # webhook configurations), get
  # on pod logs, get and list on node and pod metrics, get on nodes/proxy
  # when kubeletStats is on, and get, list and watch on Secrets only when
  # secrets.read is on. A Role to get and patch its own settings ConfigMap.
  # No writes anywhere else.
  create: true

service:
  # ClusterIP: open it with kubectl port-forward or an Ingress. LoadBalancer
  # or NodePort put it on the network: with a load balancer controller
  # (MetalLB, kube-vip, a cloud provider) a LoadBalancer gets an address
  # that answers on the port below; either type also opens a node port on
  # every node. Without TLS (an Ingress with tls, or a proxy that sets
  # X-Forwarded-Proto) sessions travel over plain HTTP.
  type: ClusterIP
  port: 8081
  # NodePort and LoadBalancer: the port opened on every node, 30000 to
  # 32767 unless the API server allows more. Empty lets Kubernetes pick.
  nodePort: null
  # LoadBalancer: which controller takes it, and an address to ask for.
  loadBalancerClass: ""
  loadBalancerIP: ""
  # Node addresses on which kube-proxy should also answer on the port, for
  # clusters without a load balancer controller: list every node's address
  # to reach the console on each node at the port above.
  externalIPs: []
  # Cluster: every node forwards to the console. Local: only the node
  # running it answers, but the console sees the client's real address.
  externalTrafficPolicy: Cluster
  annotations: {}

networkPolicy:
  enabled: true
  # Peers allowed to reach the console on its HTTP port, as NetworkPolicy
  # "from" entries. kubectl port-forward needs none. With a LoadBalancer or
  # NodePort Service an empty list allows every address, since that is
  # what exposing it means; list networks here to narrow it.
  ingressFrom: []
  # The console connects to Kubernetes API servers, its own and the other
  # clusters' it shows, on these ports (6443 is where most API servers
  # listen behind the kubernetes Service; minikube uses 8443 and MicroK8s
  # 16443).
  apiServerPorts: [443, 6443]
  # The API servers' addresses, as CIDRs, to allow nothing else. Empty
  # allows any address on the ports above, since the addresses differ from
  # cluster to cluster and managed clusters change them. DNS is always
  # allowed, for the API servers given by name.
  apiServerCIDRs: []
  # With OIDC sign-in, an audit webhook or Sherlock (sherlock.egress) the
  # console also needs the provider's, webhook's or Claude API's HTTPS
  # port; it is allowed then. List CIDRs to narrow where it may connect
  # for them.
  outboundPorts: [443]
  outboundCIDRs: []

# The server keeps a watched copy of every node, pod, workload and Service,
# trimmed to what the tabs show; 1Gi holds 500 nodes and 15,000 pods with
# room to spare. It sizes its garbage collector to 90% of the memory limit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
