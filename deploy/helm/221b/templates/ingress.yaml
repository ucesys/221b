{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "Set ingress.host: the name people will open the console at" }}
{{- end }}
# Publishes the console at one host (P3-11). With tls the Ingress controller
# terminates TLS; the console then redirects plain HTTP and marks sessions
# Secure, reading X-Forwarded-Proto.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "b221.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "b221.fullname" . }}
                port:
                  name: http
{{- end }}
