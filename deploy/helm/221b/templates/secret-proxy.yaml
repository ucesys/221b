{{- /* A token the replicas share (P7-02): a replica that forwards a request
     to the leader sends it with the person's address, and the leader
     believes the address only with the token. Made once and kept across
     upgrades. Where the chart is rendered without a cluster to look in
     (helm template), each render makes a new one; replicas started with
     different tokens still work, but the leader then records the
     forwarding replica's address in the audit log. */ -}}
{{- $name := printf "%s-proxy" (include "b221.fullname" .) -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $old $old.data (index $old.data "token") }}
  token: {{ index $old.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
