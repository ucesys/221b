{{- if ne (include "b221.shared" .) "only" }}
{{- if .Values.rbac.create }}
# Read-only across the cluster: exactly the kinds the tabs show, which the
# server watches, and the YAML view reads live. No writes. Secrets only
# with secrets.read, and then only their key names and sizes, a TLS
# certificate's names and validity, and Helm's release records, leave the
# server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  # Nodes, namespaces and pods, Services and what they front, and the kinds
  # each namespace lists: ConfigMaps as key names only.
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - serviceaccounts
      - resourcequotas
      - limitranges
      - events
    verbs: ["get", "list", "watch"]
  {{- if .Values.secrets.read }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Pod logs, streamed to the pod details.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Workloads: the owners of pods, and what a namespace runs.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # The Storage tab (ST-19): volumes, classes and the attachments of
  # volumes to nodes, all cluster-scoped. Claims are above.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # Who may do what (the Access tab): roles and the bindings that grant
  # them, read to work out each identity's permissions.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # What limits workloads (the Policies tab): disruption budgets, priority
  # classes and admission webhooks; quotas, limit ranges and network
  # policies are above.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  # CPU and memory in use, per node and per pod, from metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  {{- if ne .Values.auth.mode "none" }}
  # Read as each signed-in person (P3-02): logs and YAML are read with
  # their name and groups, and before any row reaches them Kubernetes is
  # asked whether they may list it. Nothing is written in their name.
  # User names are dynamic, so any may be asserted; the groups are exactly
  # the ones values list, with their prefixes, plus the reserved ones, so
  # the console cannot assert system:masters or any other group (RB-37).
  # OIDC without role lists keeps every group of a token, as before.
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  {{- with .Values.automation.runIdentities }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["impersonate"]
    resourceNames: {{ toJson . }}
  {{- end }}
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    {{- if include "b221.groupsLimited" . }}
    resourceNames:
      {{- range (include "b221.assertedGroups" . | fromJsonArray) }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.kubeletStats }}
  # Each node's boot time, read once per boot from its kubelet's Summary
  # API through the API server's node proxy (uptime in the node details).
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "b221.clusterScopedName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and (ne .Values.localCluster.mode "read") (ne .Values.localCluster.mode "write") }}
{{- fail "localCluster.mode must be read or write" }}
{{- end }}
{{- if and (eq .Values.localCluster.mode "write") (eq .Values.auth.mode "none") }}
---
# Watson's changes with sign-in off (Phase 6): nobody is signed in to run
# them as, so they run as the console itself. Nodes, to cordon, drain and
# label them; the rest comes from localCluster.writeClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq .Values.localCluster.writeClusterRole "minimal" }}
---
# What Watson's changes need with sign-in off, and no more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson-write
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "serviceaccounts", "replicationcontrollers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/rollback", "daemonsets", "statefulsets", "statefulsets/scale", "replicasets", "replicasets/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"{{ if .Values.secrets.read }}, "get", "list", "watch"{{ end }}]
{{- end }}
{{- if .Values.localCluster.writeClusterRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ if eq .Values.localCluster.writeClusterRole "minimal" }}{{ include "b221.clusterScopedName" . }}-watson-write{{ else }}{{ .Values.localCluster.writeClusterRole }}{{ end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
---
# What it writes, all in its own namespace (X-03): the temporary wiki
# store's ConfigMap, the ConfigMaps of before 0.13 it deletes once their
# records are in the database (DB-72), the connections to other clusters,
# one Secret each (P3-04), and the Lease its replicas elect a leader with
# (P7-02). Its records are in the database (DB-69). Kubernetes cannot
# grant Secrets by name prefix, so the Role covers every Secret in this
# namespace; keep the console in a namespace of its own. The replicas
# watch the Secrets, so a change made through one reaches the others at
# once.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "b221.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  # The ConfigMaps a release before 0.13 kept its records in, named after the
  # release (<fullname>-<what>), and each case's own, <release>-case-<n>, labelled
  # app.kubernetes.io/instance and 221b.io/case: read by the one-time
  # copies and deleted once the database holds what they held (DB-55,
  # DB-72). resourceNames cannot name the cases' ConfigMaps, which are
  # listed by their labels, so this grants get, list and delete on the
  # ConfigMaps of this namespace; the console deletes no other ConfigMap
  # than those (the temporary wiki store's of before, <release>-wiki,
  # among them: DB-96), and creates, patches and updates none.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "delete"]
  # The election: the chart creates the Lease; a replica creates it again
  # if someone deleted it, and renews or takes over only this one.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ printf "%s-leader" (include "b221.fullname" .) | quote }}]
    verbs: ["get", "update"]
  # The backups' key (ADR-137): the Secret <release>-backup-key, which the
  # console makes at start when there is none (its create is the rule
  # below: Kubernetes cannot name what a create makes) and from then on
  # only reads. The console never changes or deletes it, and it outlives
  # the release (helm.sh/resource-policy: keep).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ printf "%s-backup-key" (include "b221.fullname" .) | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "b221.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "b221.fullname" . }}-settings
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
