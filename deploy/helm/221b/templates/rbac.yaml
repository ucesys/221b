{{- if .Values.rbac.create }}
# Read-only: exactly what the Nodes tab reads. No Secrets, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "b221.clusterScopedName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
