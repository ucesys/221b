{{- if .Values.rbac.create }}
# Read-only across the cluster: exactly the kinds the tabs show, which the
# server watches, and the YAML view reads live. No writes. Secrets only
# with secrets.read, and then only their key names and sizes, a TLS
# certificate's names and validity, and Helm's release records, leave the
# server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  # Nodes, namespaces and pods, Services and what they front, and the kinds
  # each namespace lists: ConfigMaps as key names only.
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
      - pods
      - services
      - endpoints
      - persistentvolumeclaims
      - configmaps
      - serviceaccounts
      - resourcequotas
      - limitranges
      - events
    verbs: ["get", "list", "watch"]
  {{- if .Values.secrets.read }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  # Pod logs, streamed to the pod details.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Workloads: the owners of pods, and what a namespace runs.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  # Who may do what (the Access tab): roles and the bindings that grant
  # them, read to work out each identity's permissions.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
  # What limits workloads (the Policies tab): disruption budgets, priority
  # classes and admission webhooks; quotas, limit ranges and network
  # policies are above.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  # CPU and memory in use, per node and per pod, from metrics-server.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  {{- if ne .Values.auth.mode "none" }}
  # Read as each signed-in person (P3-02): logs and YAML are read with
  # their name and groups, and before any row reaches them Kubernetes is
  # asked whether they may list it. Nothing is written in their name.
  # User names are dynamic, so any may be asserted; the groups are exactly
  # the ones values list, with their prefixes, plus the reserved ones, so
  # the console cannot assert system:masters or any other group (RB-37).
  # OIDC without role lists keeps every group of a token, as before.
  - apiGroups: [""]
    resources: ["users"]
    verbs: ["impersonate"]
  - apiGroups: [""]
    resources: ["groups"]
    verbs: ["impersonate"]
    {{- if include "b221.groupsLimited" . }}
    resourceNames:
      {{- range (include "b221.assertedGroups" . | fromJsonArray) }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  {{- end }}
  {{- if .Values.kubeletStats }}
  # Each node's boot time, read once per boot from its kubelet's Summary
  # API through the API server's node proxy (uptime in the node details).
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "b221.clusterScopedName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and (ne .Values.localCluster.mode "read") (ne .Values.localCluster.mode "write") }}
{{- fail "localCluster.mode must be read or write" }}
{{- end }}
{{- if and (eq .Values.localCluster.mode "write") (eq .Values.auth.mode "none") }}
---
# Watson's changes with sign-in off (Phase 6): nobody is signed in to run
# them as, so they run as the console itself. Nodes, to cordon, drain and
# label them; the rest comes from localCluster.writeClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "b221.clusterScopedName" . }}-watson-nodes
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.localCluster.writeClusterRole }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "b221.clusterScopedName" . }}-watson
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.localCluster.writeClusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
---
# What it writes, all in its own namespace (X-03): its settings, in its
# own ConfigMap, and the connections to other clusters, one Secret each
# (P3-04). Kubernetes cannot grant Secrets by name prefix, so the Role
# covers every Secret in this namespace; keep the console in a namespace
# of its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "b221.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ include "b221.fullname" . | quote }}]
    verbs: ["get", "patch"]
  {{- if eq .Values.connections.store "secrets" }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
  {{- else if ne .Values.connections.store "memory" }}
  {{- fail "connections.store must be secrets or memory" }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "b221.fullname" . }}-settings
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "b221.fullname" . }}-settings
subjects:
  - kind: ServiceAccount
    name: {{ include "b221.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
