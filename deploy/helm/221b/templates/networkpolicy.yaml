{{- if .Values.networkPolicy.enabled }}
# Nothing may reach the console except the peers listed in values
# (kubectl port-forward and kubelet probes are not affected), and the
# console may only reach DNS and the Kubernetes API server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "b221.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "b221.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  {{- with .Values.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
