{{- if ne (include "b221.shared" .) "only" }}
{{- /*
The ConfigMaps a release before 0.13 kept its records in (DB-72, ADR-167):
the settings, the audit log, the Toolbox's session records, the AI
agents, Mycroft's knowledge, Automation's scripts and runs, the issue
service, the proposed changes (<release>-proposals, and <release>-cases
of before CF-104), the jobs, the case work, and the temporary wiki store
(<release>-wiki, CF-57, whose wiki the database keeps since DB-96). The console copies each
into the database at its first start and deletes it once every record
set it held is there. Each is rendered only while it is in the cluster,
empty and with helm.sh/resource-policy keep, so that helm upgrade from
0.12 keeps it for the copy and never makes it again after; see
b221.copySource. A release that starts at 0.13 has none.
*/}}
{{- range $suffix := list "" "-audit" "-sessions" "-ai" "-knowledge" "-automation" "-automation-runs" "-issues" "-proposals" "-cases" "-runs" "-casework" "-wiki" }}
{{- include "b221.copySource" (list $ $suffix) }}
{{- end }}
---
# The agents' baseline house instructions, from agents.<agent>.instructions,
# one file each. The chart owns this one; the console only reads it, at
# start. Configuration, not a record set: it stays (DB-72).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "b221.fullname" . }}-agents
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
{{- with include "b221.agentBaselines" . | trim }}
data:
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
