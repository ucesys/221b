# The Lease the replicas elect the one that runs Sherlock and Watson with
# (P7-02). The chart only creates it, empty, so helm uninstall removes it;
# the replicas write who holds it.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "b221.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
spec: {}
