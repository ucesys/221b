{{- /* Credentials the console needs for sign-in and the audit webhook, when
     given in values rather than as existing Secrets (X-04). */ -}}
{{- $local := and (eq .Values.auth.mode "local") (not .Values.auth.local.existingSecret) -}}
{{- $oidc := and (eq .Values.auth.mode "oidc") .Values.auth.oidc.clientSecret (not .Values.auth.oidc.existingSecret) -}}
{{- $hook := and .Values.audit.webhook.url .Values.audit.webhook.token (not .Values.audit.webhook.existingSecret) -}}
{{- if or $local $oidc $hook }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "b221.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $local }}
  users.yaml: |
    {{- toYaml .Values.auth.local.users | nindent 4 }}
  {{- end }}
  {{- if $oidc }}
  client-secret: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
  {{- if $hook }}
  token: {{ .Values.audit.webhook.token | quote }}
  {{- end }}
{{- end }}
