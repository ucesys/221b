{{- if not .Values.clusterName }}
{{- fail "Set clusterName: the name shown in the console's top bar, such as --set clusterName=staging" }}
{{- end }}
{{- include "b221.validate" . }}
{{- if and (eq .Values.auth.mode "oidc") (or (not .Values.auth.oidc.issuer) (not .Values.auth.oidc.clientID)) }}
{{- fail "OIDC sign-in needs auth.oidc.issuer and auth.oidc.clientID" }}
{{- end }}
{{- if and (eq .Values.auth.mode "oidc") (not .Values.auth.oidc.clientSecret) (not .Values.auth.oidc.existingSecret) }}
{{- fail "OIDC sign-in needs the client secret: auth.oidc.clientSecret, or auth.oidc.existingSecret naming a Secret with the key client-secret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "b221.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b221.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "b221.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "b221.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The roles' groups and the directory are read at start-up, so a
        # change of them restarts the console.
        checksum/auth-config: {{ include "b221.authConfig" . | sha256sum }}
        # The local accounts, the OIDC client secret, the setup code and the
        # webhook token are read at start-up too. A Secret named by an
        # existingSecret value is not the chart's: after changing one, run
        # kubectl rollout restart.
        checksum/auth-secret: {{ include (print $.Template.BasePath "/secret-auth.yaml") . | sha256sum }}
        {{- if include "b221.movingTag" . }}
        # A moving tag may point at a new build since the last upgrade, and
        # an unchanged pod template would not restart the pod to fetch it.
        # The release revision changes with every helm upgrade, so each one
        # rolls the pod, which then pulls the tag again.
        221b/release-revision: {{ .Release.Revision | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "b221.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: console
          image: {{ include "b221.image" . | quote }}
          imagePullPolicy: {{ include "b221.pullPolicy" . }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: LOCAL_MODE
              value: {{ .Values.localCluster.mode | quote }}
            - name: LISTEN
              value: ":8080"
            # The refresh rate until someone changes it in Settings, which
            # keeps the choice in the ConfigMap named here.
            - name: REFRESH
              value: {{ .Values.refresh | quote }}
            - name: SETTINGS_CONFIGMAP
              value: {{ printf "%s/%s" .Release.Namespace (include "b221.fullname" .) | quote }}
            {{- if eq .Values.connections.store "secrets" }}
            # The connections to other clusters, one Secret each, named
            # after the release: <release>-cluster-<id>.
            - name: CONNECTIONS_SECRETS
              value: {{ printf "%s/%s" .Release.Namespace (include "b221.fullname" .) | quote }}
            {{- end }}
            - name: KUBELET_STATS
              value: {{ .Values.kubeletStats | quote }}
            # Whether Secrets are read at all (key names and sizes, TLS
            # certificates' names and validity, and Helm release records;
            # never values). Off hides the Helm tab.
            - name: SECRETS_READ
              value: {{ .Values.secrets.read | quote }}
            # Sherlock (Phase 5): the Claude API, and where its key is kept.
            - name: SHERLOCK_API_URL
              value: {{ .Values.sherlock.apiURL | quote }}
            {{- with .Values.sherlock.provider }}
            # The model's API when the settings name none (Phase 6 review).
            - name: SHERLOCK_PROVIDER
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.sherlock.lockProvider }}
            - name: SHERLOCK_LOCK_PROVIDER
              value: "true"
            {{- end }}
            {{- if eq .Values.connections.store "secrets" }}
            - name: SHERLOCK_SECRET
              value: {{ printf "%s/%s-sherlock" .Release.Namespace (include "b221.fullname" .) | quote }}
            {{- end }}
            {{- with .Values.sherlock.existingSecret }}
            - name: SHERLOCK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.sherlock.existingSecretKey | quote }}
            {{- end }}
            - name: HEALTH_INTERVAL
              value: {{ .Values.healthInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Host names it answers to besides localhost and IP addresses:
            # its Service's DNS names and any set in values.
            - name: ALLOWED_HOSTS
              value: {{ include "b221.allowedHosts" . | quote }}
            # Sign-in (P3-01) and roles (P3-03).
            - name: AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            {{- if ne .Values.auth.mode "none" }}
            # Reading as each person (P3-02): the prefixes the API servers put
            # before OIDC user and group names.
            - name: IMPERSONATE_USER_PREFIX
              value: {{ .Values.auth.kubernetes.userPrefix | quote }}
            - name: IMPERSONATE_GROUP_PREFIX
              value: {{ .Values.auth.kubernetes.groupPrefix | quote }}
            - name: ACCESS_TTL
              value: {{ .Values.auth.kubernetes.accessTTL | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "b221.authSecret" .) .Values.auth.oidc.existingSecret | quote }}
                  key: client-secret
            - name: OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: OIDC_USERNAME_CLAIM
              value: {{ .Values.auth.oidc.usernameClaim | quote }}
            - name: OIDC_GROUPS_CLAIM
              value: {{ .Values.auth.oidc.groupsClaim | quote }}
            - name: OIDC_PROVIDER_NAME
              value: {{ .Values.auth.oidc.providerName | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.auth.oidc.redirectURL | quote }}
            {{- end }}
            # The roles' groups, the local groups and the directory.
            - name: AUTH_CONFIG_FILE
              value: /etc/221b/auth-config/auth.json
            {{- if include "b221.localUsers" . }}
            - name: LOCAL_USERS_FILE
              value: /etc/221b/auth/users.yaml
            {{- end }}
            {{- if and (ne .Values.auth.mode "none") (or .Values.auth.setupToken .Values.auth.setupTokenSecret) }}
            # Typed on the first-run page, when it is asked for.
            - name: SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "b221.authSecret" .) .Values.auth.setupTokenSecret | quote }}
                  key: setup-token
            {{- end }}
            {{- if eq .Values.auth.mode "ldap" }}
            # The search account's password, from the Secret named in values.
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.ldap.existingSecret | quote }}
                  key: bind-password
            {{- end }}
            - name: ADMINS
              value: {{ join "," .Values.auth.admins | quote }}
            - name: ADMIN_GROUPS
              value: {{ join "," .Values.auth.adminGroups | quote }}
            - name: SESSION_IDLE
              value: {{ .Values.auth.sessionIdle | quote }}
            - name: SESSION_MAX
              value: {{ .Values.auth.sessionMax | quote }}
            {{- if .Values.audit.webhook.url }}
            # The audit webhook (P3-10).
            - name: AUDIT_WEBHOOK_URL
              value: {{ .Values.audit.webhook.url | quote }}
            {{- if or .Values.audit.webhook.token .Values.audit.webhook.existingSecret }}
            - name: AUDIT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "b221.authSecret" .) .Values.audit.webhook.existingSecret | quote }}
                  key: token
            {{- end }}
            {{- end }}
            {{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
            # Behind an Ingress with TLS, plain HTTP is redirected (P3-11).
            - name: HTTPS_REDIRECT
              value: "true"
            {{- end }}
          volumeMounts:
            - name: auth-config
              mountPath: /etc/221b/auth-config
              readOnly: true
            {{- if include "b221.localUsers" . }}
            - name: auth
              mountPath: /etc/221b/auth
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.caSecret }}
            - name: ldap-ca
              mountPath: /etc/221b/ldap-ca
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: auth-config
          configMap:
            name: {{ include "b221.fullname" . }}-auth-config
        {{- if include "b221.localUsers" . }}
        - name: auth
          secret:
            secretName: {{ default (include "b221.authSecret" .) .Values.auth.local.existingSecret | quote }}
            items:
              - key: users.yaml
                path: users.yaml
        {{- end }}
        {{- if and (eq .Values.auth.mode "ldap") .Values.auth.ldap.caSecret }}
        - name: ldap-ca
          secret:
            secretName: {{ .Values.auth.ldap.caSecret | quote }}
            items:
              - key: {{ .Values.auth.ldap.caSecretKey | quote }}
                path: {{ .Values.auth.ldap.caSecretKey | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
