<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Set up · {{.Title}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/signin.css">
</head>
<body>
<main class="si" aria-labelledby="si-title">
  <div class="si-card">
    <div class="si-brand" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path></svg>
    </div>
    <h1 id="si-title">Create the first administrator</h1>
    <p class="si-sub">No one can sign in yet. The account you create here becomes a SuperAdmin. This page closes for good as soon as it exists.</p>
    {{if .Error}}<p class="si-error" role="alert" data-testid="setup-error">{{.Error}}</p>{{end}}
    <form method="post" action="/setup" class="si-form" data-testid="setup-form">
      <input type="hidden" name="form" value="{{.Form}}">
      <label class="si-field"><span>Setup token</span><input name="token" type="password" autocomplete="off" data-testid="setup-token"><small>Enter <code>auth.setupToken</code> if specified on deployment, if not leave blank.</small></label>
      <label class="si-field"><span>Username</span><input name="username" type="text" autocomplete="username" required autofocus value="{{.Username}}" data-testid="setup-username"><small>Lowercase letters, digits, dot, dash and underscore.</small></label>
      <label class="si-field"><span>Display name</span><input name="name" type="text" autocomplete="name" value="{{.Name}}"></label>
      <label class="si-field"><span>Password</span><input name="password" type="password" autocomplete="new-password" required minlength="12" data-testid="setup-password"><small>At least 12 characters, and not your username.</small></label>
      <label class="si-field"><span>Repeat the password</span><input name="again" type="password" autocomplete="new-password" required minlength="12" data-testid="setup-again"></label>
      <button type="submit" class="si-btn" data-testid="setup-submit">Create administrator</button>
    </form>
  </div>
</main>
</body>
</html>
