<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Change password · {{.Title}}</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/signin.css">
</head>
<body>
<main class="si" aria-labelledby="si-title">
  <div class="si-card">
    <div class="si-brand" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path></svg>
    </div>
    <h1 id="si-title">Change your password</h1>
    <p class="si-sub">For an account of this console. You are signed out everywhere once it changes.</p>
    {{if and .Error (not .Field)}}<p class="si-error" role="alert" data-testid="password-error">{{.Error}}</p>{{end}}
    <form method="post" action="/signin/password" class="si-form" data-testid="password-form">
      <input type="hidden" name="next" value="{{.Next}}">
      <input type="hidden" name="form" value="{{.Form}}">
      <label class="si-field"><span>Username</span><input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required {{if not .Field}}autofocus {{end}}value="{{.Username}}" data-testid="password-username"></label>
      <label class="si-field"><span>Current password</span><input name="current" type="password" autocomplete="current-password" required value="{{.Current}}" data-testid="password-current"></label>
      <label class="si-field"><span>New password</span><input name="password" type="password" autocomplete="new-password" required minlength="12" value="{{.Password}}"{{if eq .Field "password"}} autofocus aria-invalid="true" aria-describedby="password-error"{{end}} data-testid="password-new">{{if eq .Field "password"}}<small class="si-ferr" id="password-error" role="alert" data-testid="password-field-error">{{.Error}}</small>{{else}}<small>At least 12 characters, and not your username.</small>{{end}}</label>
      <label class="si-field"><span>Repeat the new password</span><input name="again" type="password" autocomplete="new-password" required minlength="12"{{if eq .Field "again"}} autofocus aria-invalid="true" aria-describedby="again-error"{{end}} data-testid="password-again">{{if eq .Field "again"}}<small class="si-ferr" id="again-error" role="alert" data-testid="password-field-error">{{.Error}}</small>{{end}}</label>
      <button type="submit" class="si-btn" data-testid="password-submit">Change password</button>
    </form>
    {{if .Directory}}<p class="si-note">Directory (LDAP) accounts change their password in the directory.</p>{{end}}
    <p class="si-links"><a href="/signin?next={{.Next}}" data-testid="password-back">Back to sign in</a></p>
  </div>
</main>
<script src="/signin.js"></script>
</body>
</html>
