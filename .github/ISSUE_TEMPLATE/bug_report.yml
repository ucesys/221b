name: Bug report
description: Something in 221B does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Security problems go to the Security tab, not here** (see SECURITY.md).
        Please leave out Secret values, tokens and anything else private from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to see it
      description: Steps from a fresh page, or the simulator (`make dev-sim`) if it shows there.
      placeholder: |
        1. Open the Pods tab
        2. Filter by …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag, or `version` in the console's log (`kubectl -n <namespace> logs deploy/<release> | grep serving`).
      placeholder: 0.9.1
    validations:
      required: true
  - type: input
    id: kubernetes
    attributes:
      label: Kubernetes
      description: The Kubernetes version and distribution (kind, k3s, RKE2, EKS, GKE, AKS, …).
      placeholder: 1.37.1, RKE2
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome or Edge, Firefox, Safari, Other, Not a browser problem]
  - type: textarea
    id: values
    attributes:
      label: Chart values and logs
      description: The chart values you changed (without secrets), and any errors from the console's log or the browser console.
      render: text
