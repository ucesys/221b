# Every pull request and every push to main: lint, unit tests, the browser
# build, license checks, the two images (the console's, and 221b-postgres,
# the bundled database's) with their size and vulnerability gates, the
# chart installed in kind with its bundled database on each maintained
# Kubernetes minor with the browser tests, and the scale test with kwok.
# The console keeps its records in PostgreSQL and does not run without it
# (DB-69): every job that runs a console runs a PostgreSQL too. Both images
# are published to GitHub Container Registry, under the same tags, from
# main, from this repository's pull requests and from runs started by hand
# on a branch (branch-<name>, never main); for a version tag the console's
# image is published here and the database's by release.yml, beside the
# copy of its packages.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.9'
  NODE_VERSION: '24'
  HELM_VERSION: 'v4.3.0'
  IMAGE: ghcr.io/ucesys/221b
  # The bundled database's image (deploy/postgres, built from Wolfi's
  # packages by hack/wolfi-postgres.sh), published beside the console's
  # under the same tags: the chart runs it at its appVersion.
  DB_IMAGE: ghcr.io/ucesys/221b-postgres

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The repositories' tests run against a PostgreSQL (Phase 13, DB-16);
    # without TEST_DATABASE they are skipped, as on a laptop. A service
    # cannot read hack/base-images.env, so the pin is written here, and
    # hack/check-base-images.sh checks it is POSTGRES_IMAGE.
    services:
      postgres:
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE: 127.0.0.1:55432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Format and vet
        run: make lint-go 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Unit and integration tests
        run: make test-go 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      # The agents', the jobs' and the case work's own tests again, with
      # their records in the database's tables (Phase 13, DB-40, DB-42, DB-43).
      - name: The services' tests over the database
        run: make test-go-store 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Sherlock's evaluation, against the fake Claude API
        # The nightly run asks the real API (sherlock-eval.yml); here the
        # cases are found in the simulator and asked end to end. The
        # console's database is a throwaway PostgreSQL the script starts in
        # Docker, apart from the tests' service.
        run: hack/sherlock-eval.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Licenses
        working-directory: server
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./... --disallowed_types=forbidden,restricted,unknown --ignore github.com/ucesys/221b 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Go" "$RUNNER_TEMP/ci.log"

  web:
    name: Browser app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Type check and lint
        working-directory: web
        run: (npm run typecheck && npm run lint) 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Unit tests
        working-directory: web
        run: npm test 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Build
        working-directory: web
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Licenses
        working-directory: web
        run: npm run licenses 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Known vulnerabilities in shipped packages
        working-directory: web
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Browser app" "$RUNNER_TEMP/ci.log"

  browsers:
    # Each browser's suite runs in three shards, one job each: serially a
    # browser took 25 to 43 minutes. Every shard starts its own simulator
    # and console, so shards share no state. The job has room for both steps'
    # own limits: a slow mirror once held the browser's packages back 29
    # minutes, and the cancelled job held back the release's image.
    name: Browser tests (${{ matrix.name }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Firefox's page loads stall in CI, failing a different test each run:
    # its job still shows red, but does not fail the run or hold back an
    # image. Chromium and WebKit must pass.
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    # The simulator's console keeps its records in this PostgreSQL (DB-69),
    # an empty one for each shard: make e2e-sim uses it through
    # DEV_DATABASE in place of starting one in Docker, so it is pinned like
    # the Go job's and is up before the first step.
    services:
      postgres:
        image: postgres:18@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
        include:
          - browser: chromium
            name: Chromium
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Packages
        working-directory: web
        run: npm ci --no-fund
      - name: Browsers
        # Fails the step, not the job, like the tests below.
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browser: ${{ matrix.browser }}
      - name: End-to-end tests against a simulated cluster
        # A step that runs out of time fails; a job that does is cancelled,
        # which continue-on-error does not cover, so a stalled Firefox shard
        # would hold back a release tag's image.
        timeout-minutes: 25
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_ARGS: --shard=${{ matrix.shard }}/3
          DEV_DATABASE: 127.0.0.1:55432
        run: make e2e-sim 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/failures.sh "$RUNNER_TEMP/ci.log" > "$RUNNER_TEMP/failures.log" || true
          hack/annotate.sh "Browser test failures" "$RUNNER_TEMP/failures.log" 14000
          hack/annotate.sh "Browser tests" "$RUNNER_TEMP/ci.log" 4000
          hack/annotate.sh "Server log" bin/e2e-server.log 2000

  # Outside contributors sign off each commit (Developer Certificate of
  # Origin, CONTRIBUTING.md); this repository's own branches are the
  # maintainers'.
  signoff:
    name: Sign-off
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Every commit signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: hack/check-signoff.sh "$BASE" "$HEAD"

  chart:
    name: Chart and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint and validate
        run: hack/check-chart.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      # Phase 12: every source a prompt copies from is recorded, with its license.
      - name: Prompt sources
        run: hack/check-prompt-sources.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      # Every base image of both Dockerfiles, and the PostgreSQL the jobs
      # run, pinned to a digest of the tag its source names.
      - name: Base images pinned
        run: hack/check-base-images.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      # Phase 13: who takes the bundled database's base backup, and that its
      # container stops when told to.
      - name: The database's backup container
        run: hack/check-db-backup.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Shell scripts
        run: shellcheck -x --severity=warning hack/*.sh deploy/postgres/*.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Chart" "$RUNNER_TEMP/ci.log"

  image:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, or take the build pushed for this tree
        # hack/push-prebuilt.sh pushes a build made elsewhere as
        # prebuilt-<tree>; with one labelled for exactly this tree it is
        # checked and tested below instead of building again. A pull
        # request is tested as its merge commit, whose tree is the branch's
        # while the branch is up to date with its base.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p bin
          tree=$(git rev-parse 'HEAD^{tree}')
          pre="$IMAGE:prebuilt-${tree::12}"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 || true
          # A release is never a prebuilt: this build, with its version, is
          # what the gates test and what publish pushes for linux/amd64.
          version="ci-${GITHUB_SHA::12}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && docker pull -q "$pre" >/dev/null 2>&1 && [ "$(docker image inspect "$pre" --format '{{index .Config.Labels "dev.221b.tree"}}')" = "$tree" ]; then
            echo "::notice title=Prebuilt image::$pre was built from this tree; it is tested instead of a new build."
            docker tag "$pre" "$IMAGE:ci"
          else
            pins=()
            while read -r line; do pins+=(--build-arg "$line"); done < <(grep -v '^#' hack/base-images.env)
            docker build "${pins[@]}" --build-arg VERSION="$version" --build-arg COMMIT="${GITHUB_SHA::12}" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" -t "$IMAGE:ci" . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          fi
      - name: Size, user and contents
        run: |
          size=$(docker image inspect "$IMAGE:ci" --format '{{.Size}}')
          echo "::notice title=Image size::$(( size / 1000 / 1000 )) MB ($size bytes)"
          [ "$size" -lt 200000000 ] || { echo "The image is $size bytes; the limit is 200 MB." | tee -a "$RUNNER_TEMP/ci.log"; exit 1; }
          [ "$(docker image inspect "$IMAGE:ci" --format '{{.Config.User}}')" = "65532:65532" ]
          # Distroless: there is no shell to run.
          if docker run --rm --entrypoint /bin/sh "$IMAGE:ci" -c true 2>/dev/null; then echo "The image has a shell." | tee -a "$RUNNER_TEMP/ci.log"; exit 1; fi
          docker run --rm --read-only "$IMAGE:ci" -h 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Build the database's image
        # 221b-postgres (deploy/postgres): PostgreSQL and Patroni from Wolfi's
        # packages, assembled by apko from the committed lock (the same lock
        # gives the same base, checked against the Dockerfile's digest), WAL-G's
        # release, the bundled database's (DB-69). Always built here, for
        # linux/amd64, the platform the kind jobs run; the Go image and the
        # BuildKit frontend are the console's pins. hack/wolfi-postgres.sh
        # fetches its tools at pinned versions, each checked by its SHA-256.
        run: |
          version="ci-${GITHUB_SHA::12}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          export DB_LABELS="org.opencontainers.image.revision=$GITHUB_SHA
          org.opencontainers.image.version=$version"
          DB_IMAGE="$DB_IMAGE:ci" PLATFORM=linux/amd64 hack/wolfi-postgres.sh image 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          exit "${PIPESTATUS[0]}"
      - name: The database's image's size, user and contents
        run: |
          size=$(docker image inspect "$DB_IMAGE:ci" --format '{{.Size}}')
          echo "::notice title=Database image size::$(( size / 1000 / 1000 )) MB ($size bytes)"
          [ "$size" -lt 600000000 ] || { echo "The database's image is $size bytes; the limit is 600 MB." | tee -a "$RUNNER_TEMP/ci.log"; exit 1; }
          # The chart's securityContext runs it as 999, the owner of the data.
          [ "$(docker image inspect "$DB_IMAGE:ci" --format '{{.Config.User}}')" = "999:999" ]
          docker run --rm --read-only --entrypoint postgres "$DB_IMAGE:ci" --version 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          docker run --rm --read-only --entrypoint patroni "$DB_IMAGE:ci" --version 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          docker run --rm --read-only --entrypoint wal-g "$DB_IMAGE:ci" --version 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Vulnerability scan of both images (fails on high or critical)
        # Both images by one rule: any high or critical finding fails it,
        # with a fix or without, and every finding is listed. The console's
        # is distroless; the database's is built from Wolfi's packages,
        # which had none high or critical when it became the image (an
        # unfixed one there is fixed by moving the lock, make postgres-lock).
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          # Each finding as one line: SEVERITY ID in PACKAGE VERSION, fixed in ...
          line='"\(.vulnerability.severity) \(.vulnerability.id) in \(.artifact.name) \(.artifact.version), fixed in \(.vulnerability.fix.versions | join(" or "))"'
          set +e
          "$GRYPE" "docker:$IMAGE:ci" --fail-on high -o table -o "json=$RUNNER_TEMP/grype.json" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          code=${PIPESTATUS[0]}
          "$GRYPE" "docker:$DB_IMAGE:ci" --fail-on high -o table -o "json=$RUNNER_TEMP/grype-db.json" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          dbcode=${PIPESTATUS[0]}
          set -e
          for f in grype grype-db; do
            jq -r ".matches[] | $line" "$RUNNER_TEMP/$f.json" | sort -u > "$RUNNER_TEMP/findings-$f.txt" || true
          done
          if [ -s "$RUNNER_TEMP/findings-grype.txt" ]; then
            echo "::warning title=Vulnerability findings in the console's image::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/findings-grype.txt")"
          fi
          if [ -s "$RUNNER_TEMP/findings-grype-db.txt" ]; then
            echo "::warning title=Vulnerability findings in the database's image, $(wc -l < "$RUNNER_TEMP/findings-grype-db.txt")::$(head -40 "$RUNNER_TEMP/findings-grype-db.txt" | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          if [ "$dbcode" -ne 0 ]; then exit "$dbcode"; fi
          echo "::notice title=Vulnerability scan::No high or critical vulnerability in either image."
      - name: Save
        # Both images in one file: the jobs below load them together.
        run: docker save "$IMAGE:ci" "$DB_IMAGE:ci" | gzip > bin/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: bin/image.tar.gz
          retention-days: 3
      - name: Report
        if: failure()
        run: hack/annotate.sh "Images" "$RUNNER_TEMP/ci.log"

  e2e:
    name: kind e2e (Kubernetes ${{ matrix.k8s }})
    needs: image
    runs-on: ubuntu-24.04
    # The bundled database is made before the console listens.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        k8s: ['1.35', '1.36', '1.37']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Packages
        working-directory: web
        run: npm ci --no-fund
      - name: Browser
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: bin
      - name: Load the images
        run: gunzip -c bin/image.tar.gz | docker load
      # The simulator's fake Claude API, which Sherlock's tests talk to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install, test, upgrade and uninstall in kind
        env:
          K8S: ${{ matrix.k8s }}
        run: IMAGE="$IMAGE:ci" DB_IMAGE="$DB_IMAGE:ci" hack/e2e-kind.sh "$K8S" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/failures.sh bin/e2e/playwright.log > "$RUNNER_TEMP/failures.log" || true
          hack/annotate.sh "Browser test failures on ${{ matrix.k8s }}" "$RUNNER_TEMP/failures.log" 14000
          hack/annotate.sh "Browser tests on ${{ matrix.k8s }}" bin/e2e/playwright.log 4000
          hack/annotate.sh "Cluster on ${{ matrix.k8s }}" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "e2e on ${{ matrix.k8s }}" "$RUNNER_TEMP/ci.log" 4000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.k8s }}
          path: web/playwright-report
          retention-days: 7

  # Two replicas in kind, losing a follower and then the leader: the
  # session, the event streams, Sherlock and Watson through either replica,
  # and the settings shared between them (P7-02); the bundled database with
  # three members, one on each node, losing its primary (DB-69).
  ha:
    name: Two replicas
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: bin
      - name: Load the images
        run: gunzip -c bin/image.tar.gz | docker load
      - name: Lose a follower, then the leader
        run: IMAGE="$IMAGE:ci" DB_IMAGE="$DB_IMAGE:ci" hack/ha-kind.sh 1.37 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/annotate.sh "Replicas cluster" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "Replicas" "$RUNNER_TEMP/ci.log" 4000

  scale:
    name: Scale (500 nodes, 15,000 pods)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Packages
        working-directory: web
        run: npm ci --no-fund
      - name: Browser
        timeout-minutes: 30
        uses: ./.github/actions/playwright
        with:
          browser: chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: bin
      - name: Load the images
        run: gunzip -c bin/image.tar.gz | docker load
      - name: Scale test with kwok
        run: IMAGE="$IMAGE:ci" DB_IMAGE="$DB_IMAGE:ci" hack/scale-kind.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/annotate.sh "Scale test" bin/e2e/scale.log 4000
          hack/annotate.sh "Scale cluster" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "Scale" "$RUNNER_TEMP/ci.log" 4000

  # helm upgrade from each of the two newest releases before this commit,
  # then a rollback and an upgrade again, keeping everything the console
  # stored (P7-03). The releases' images are pulled from the registry; their
  # charts come from their tags.
  upgrade:
    name: Upgrade from earlier releases
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: The two newest releases before this commit
        id: from
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin > /dev/null
          here=$(git rev-parse HEAD)
          from=()
          while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$(git rev-list -n 1 "$tag")" = "$here" ] && continue
            git merge-base --is-ancestor "$tag" HEAD || continue
            # A release whose image was never published (0.7.0) cannot be
            # installed, so nobody upgrades from it.
            if ! docker manifest inspect "$IMAGE:${tag#v}" > /dev/null 2>&1; then
              echo "::notice title=Upgrade::$tag has no image $IMAGE:${tag#v}; skipped."
              continue
            fi
            from+=("$tag")
            [ "${#from[@]}" -lt 2 ] || break
          done < <(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "tags=${from[*]}" >> "$GITHUB_OUTPUT"
          if [ "${#from[@]}" -eq 0 ]; then
            echo "::notice title=Upgrade::No release tag before this commit; there is nothing to upgrade from."
          else
            echo "::notice title=Upgrade::Upgrading from ${from[*]}."
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.from.outputs.tags != ''
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.from.outputs.tags != ''
        with:
          name: image
          path: bin
      - name: Load the images
        if: steps.from.outputs.tags != ''
        run: gunzip -c bin/image.tar.gz | docker load
      - name: Upgrade, roll back and upgrade again in kind
        if: steps.from.outputs.tags != ''
        env:
          TAGS: ${{ steps.from.outputs.tags }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin > /dev/null
          for tag in $TAGS; do
            IMAGE="$IMAGE:ci" DB_IMAGE="$DB_IMAGE:ci" hack/upgrade-kind.sh "$tag" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          done
      - name: Report
        if: failure()
        run: |
          hack/annotate.sh "Cluster after the upgrade" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "Upgrade" "$RUNNER_TEMP/ci.log" 4000

  publish:
    name: Publish images
    needs: [go, web, browsers, chart, image, e2e, ha, scale, upgrade]
    # Main, and pull requests from this repository (not forks), so a pull
    # request can be tried on a test cluster before it merges; a run started
    # by hand publishes its branch as branch-<name>. A build pushed with
    # hack/push-prebuilt.sh for this tree is published as it is. Every job must
    # pass, except that a pull request's image is published when only the
    # browser tests failed (Firefox times out on page.goto in CI); main and
    # release tags still need them all.
    if: >-
      always() &&
      needs.go.result == 'success' && needs.web.result == 'success' && needs.chart.result == 'success' &&
      needs.image.result == 'success' && needs.e2e.result == 'success' && needs.upgrade.result == 'success' &&
      needs.ha.result == 'success' && needs.scale.result == 'success' &&
      (needs.browsers.result == 'success' || (github.event_name == 'pull_request' && needs.browsers.result == 'failure')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token and attestations sign what is published: a cosign signature
    # made with the workflow's own identity, and SLSA build provenance and
    # an SPDX SBOM kept as GitHub attestations beside each image (#79). The
    # database's image is published under the console's tags, built,
    # signed and attested the same way; for a version tag release.yml
    # publishes it, with the copy of its packages.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: image
          path: bin
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        if: startsWith(github.ref, 'refs/tags/v')
        id: grype
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push for linux/amd64 and linux/arm64
        id: push
        env:
          PR: ${{ github.event.pull_request.number }}
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          mkdir -p bin
          # The commit built and tested: for a pull request its merge
          # commit, so a sha- tag names one build for good.
          sha=${GITHUB_SHA::12}
          if [ -n "$PR" ]; then
            version="pr-$PR"
            refs=("$IMAGE:pr-$PR" "$IMAGE:sha-$sha")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: v0.1.0 is published as 0.1.0, the chart's appVersion.
            version="${GITHUB_REF_NAME#v}"
            refs=("$IMAGE:$version")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="main-$sha"
            refs=("$IMAGE:main" "$IMAGE:sha-$sha")
          else
            # Run by hand on another branch: named after the branch, never
            # main. The prefix keeps it apart from main, pr-, sha- and
            # release tags; Docker allows [a-z0-9_.-] after it.
            branch="branch-$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | cut -c1-100)"
            version="$branch-$sha"
            refs=("$IMAGE:$branch" "$IMAGE:sha-$sha")
          fi
          tags=()
          for r in "${refs[@]}"; do tags+=(-t "$r"); done
          # What the signing steps below sign, by digest once it is pushed;
          # the database's image takes the same tags.
          {
            echo "ref=${refs[0]}"
            echo "tags=${refs[*]#"$IMAGE:"}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          # A release's image is never replaced: a rerun after it was
          # published keeps it as it is, and only signs it again.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "::notice title=Published::$IMAGE:$version exists already and is kept as it is; a release's image is never replaced"
            exit 0
          fi
          # The build the image job tested, when it was pushed for this tree
          # (hack/push-prebuilt.sh): published under these tags as it is,
          # for linux/amd64 only. A release is always built here.
          tree=$(git rev-parse 'HEAD^{tree}')
          pre="$IMAGE:prebuilt-${tree::12}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && docker pull -q "$pre" >/dev/null 2>&1 \
            && [ "$(docker image inspect "$pre" --format '{{index .Config.Labels "dev.221b.tree"}}')" = "$tree" ]; then
            docker buildx imagetools create "${tags[@]}" "$pre" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
            echo "::notice title=Published::${refs[*]} (the prebuilt $pre, linux/amd64)"
            exit 0
          fi
          pins=()
          while read -r line; do pins+=(--build-arg "$line"); done < <(grep -v '^#' hack/base-images.env)
          docker buildx create --name multi --driver docker-container --use
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: linux/amd64 is the image every gate tested, as it
            # is; linux/arm64, which they cannot run, is built and scanned.
            docker load < bin/image.tar.gz
            docker tag "$IMAGE:ci" "$IMAGE:$version-amd64"
            docker push "$IMAGE:$version-amd64" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
            docker buildx build --platform linux/arm64 "${pins[@]}" \
              --build-arg VERSION="$version" --build-arg COMMIT="$sha" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -t "$IMAGE:$version-arm64" --push . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
            # Named: the push is an index with an attestation beside the
            # image, and grype otherwise looks in it for the runner's platform.
            "$GRYPE" "registry:$IMAGE:$version-arm64" --platform linux/arm64 --fail-on high 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
            docker buildx imagetools create "${tags[@]}" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
            echo "::notice title=Published::${refs[*]} (linux/amd64 as tested, linux/arm64 built here and scanned)"
            exit 0
          fi
          docker buildx build --platform linux/amd64,linux/arm64 "${pins[@]}" \
            --build-arg VERSION="$version" --build-arg COMMIT="$sha" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            "${tags[@]}" --push . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          echo "::notice title=Published::${refs[*]}"
      - name: The digest published
        id: digest
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $REF"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: bin/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: bin/sbom.spdx.json
          push-to-registry: true
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        # Keyless: the certificate names this workflow, the repository and
        # the ref, and the signature is logged in Sigstore's transparency log.
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          echo "::notice title=Signed::$IMAGE@$DIGEST, with build provenance and an SBOM attested"
      - name: Build and push the database's image for linux/amd64 and linux/arm64
        # Built from the committed lock for both platforms, none under
        # emulation (the Dockerfile's last stage runs nothing). A version
        # tag's is release.yml's: it builds it with the copy of its packages
        # and signs both, so nothing here runs for a tag.
        id: dbpush
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          PUBLISHED: ${{ steps.push.outputs.tags }}
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          refs=()
          for t in $PUBLISHED; do refs+=("$DB_IMAGE:$t"); done
          echo "ref=${refs[0]}" >> "$GITHUB_OUTPUT"
          export DB_LABELS="org.opencontainers.image.revision=$GITHUB_SHA
          org.opencontainers.image.version=$VERSION"
          hack/wolfi-postgres.sh publish "${refs[@]}" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          exit "${PIPESTATUS[0]}"
      - name: The database's digest published
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        id: dbdigest
        env:
          REF: ${{ steps.dbpush.outputs.ref }}
        run: |
          digest=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $REF"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          image: ${{ env.DB_IMAGE }}@${{ steps.dbdigest.outputs.digest }}
          format: spdx-json
          output-file: bin/sbom-postgres.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: The database's SBOM attestation
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.DB_IMAGE }}
          subject-digest: ${{ steps.dbdigest.outputs.digest }}
          sbom-path: bin/sbom-postgres.spdx.json
          push-to-registry: true
      - name: The database's build provenance
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DB_IMAGE }}
          subject-digest: ${{ steps.dbdigest.outputs.digest }}
          push-to-registry: true
      - name: Sign the database's image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          DIGEST: ${{ steps.dbdigest.outputs.digest }}
        run: |
          cosign sign --yes "$DB_IMAGE@$DIGEST" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          echo "::notice title=Signed::$DB_IMAGE@$DIGEST, with build provenance and an SBOM attested"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Publish" "$RUNNER_TEMP/ci.log"
