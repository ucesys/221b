# Every pull request and every push to main: lint, unit tests, the browser
# build, license checks, the image with its size and vulnerability gates,
# the chart installed in kind on each maintained Kubernetes minor with the
# browser tests, and the scale test with kwok. Images are published to
# GitHub Container Registry from main, from version tags, from this
# repository's pull requests and from runs started by hand on a branch
# (branch-<name>, never main).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.9'
  NODE_VERSION: '24'
  HELM_VERSION: 'v4.3.0'
  IMAGE: ghcr.io/ucesys/221b

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Format and vet
        run: make lint-go 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Unit and integration tests
        run: make test-go 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Sherlock's evaluation, against the fake Claude API
        # The nightly run asks the real API (sherlock-eval.yml); here the
        # cases are found in the simulator and asked end to end.
        run: hack/sherlock-eval.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Licenses
        working-directory: server
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          go-licenses check ./... --disallowed_types=forbidden,restricted,unknown --ignore github.com/ucesys/221b 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Go" "$RUNNER_TEMP/ci.log"

  web:
    name: Browser app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-fund 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Type check and lint
        working-directory: web
        run: (npm run typecheck && npm run lint) 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Unit tests
        working-directory: web
        run: npm test 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Build
        working-directory: web
        run: npm run build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Licenses
        working-directory: web
        run: npm run licenses 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Known vulnerabilities in shipped packages
        working-directory: web
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Browser app" "$RUNNER_TEMP/ci.log"

  browsers:
    # One job per browser: together they outgrew one job's half hour.
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            name: Chromium
          - browser: firefox
            name: Firefox
          - browser: webkit
            name: WebKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browsers
        working-directory: web
        run: npm ci --no-fund && npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}
      - name: End-to-end tests against a simulated cluster
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: make e2e-sim 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/failures.sh "$RUNNER_TEMP/ci.log" > "$RUNNER_TEMP/failures.log" || true
          hack/annotate.sh "Browser test failures" "$RUNNER_TEMP/failures.log" 14000
          hack/annotate.sh "Browser tests" "$RUNNER_TEMP/ci.log" 4000
          hack/annotate.sh "Server log" bin/e2e-server.log 2000

  chart:
    name: Chart and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint and validate
        run: hack/check-chart.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Shell scripts
        run: shellcheck -x --severity=warning hack/*.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Chart" "$RUNNER_TEMP/ci.log"

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          mkdir -p bin
          docker build --build-arg VERSION="ci-${GITHUB_SHA::12}" --build-arg COMMIT="${GITHUB_SHA::12}" -t "$IMAGE:ci" . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Size, user and contents
        run: |
          size=$(docker image inspect "$IMAGE:ci" --format '{{.Size}}')
          echo "::notice title=Image size::$(( size / 1000 / 1000 )) MB ($size bytes)"
          [ "$size" -lt 80000000 ] || { echo "The image is $size bytes; the limit is 80 MB." | tee -a "$RUNNER_TEMP/ci.log"; exit 1; }
          [ "$(docker image inspect "$IMAGE:ci" --format '{{.Config.User}}')" = "65532:65532" ]
          # Distroless: there is no shell to run.
          if docker run --rm --entrypoint /bin/sh "$IMAGE:ci" -c true 2>/dev/null; then echo "The image has a shell." | tee -a "$RUNNER_TEMP/ci.log"; exit 1; fi
          docker run --rm --read-only "$IMAGE:ci" -h 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Vulnerability scan (fails on high or critical)
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set +e
          "$GRYPE" "docker:$IMAGE:ci" --fail-on high -o table -o "json=$RUNNER_TEMP/grype.json" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          code=${PIPESTATUS[0]}
          set -e
          # Every finding, whatever its severity, as one line each.
          jq -r '.matches[] | "\(.vulnerability.severity) \(.vulnerability.id) in \(.artifact.name) \(.artifact.version), fixed in \(.vulnerability.fix.versions | join(" or "))"' \
            "$RUNNER_TEMP/grype.json" | sort -u > "$RUNNER_TEMP/findings.txt" || true
          if [ -s "$RUNNER_TEMP/findings.txt" ]; then
            echo "::warning title=Vulnerability findings::$(sed ':a;N;$!ba;s/\n/%0A/g' "$RUNNER_TEMP/findings.txt")"
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "::notice title=Vulnerability scan::No high or critical vulnerability in the image."
      - name: Save
        run: docker save "$IMAGE:ci" | gzip > bin/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: bin/image.tar.gz
          retention-days: 3
      - name: Report
        if: failure()
        run: hack/annotate.sh "Image" "$RUNNER_TEMP/ci.log"

  e2e:
    name: kind e2e (Kubernetes ${{ matrix.k8s }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8s: ['1.35', '1.36', '1.37']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser
        working-directory: web
        run: npm ci --no-fund && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: bin
      - name: Load the image
        run: gunzip -c bin/image.tar.gz | docker load
      # The simulator's fake Claude API, which Sherlock's tests talk to.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install, test, upgrade and uninstall in kind
        env:
          K8S: ${{ matrix.k8s }}
        run: IMAGE="$IMAGE:ci" hack/e2e-kind.sh "$K8S" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/failures.sh bin/e2e/playwright.log > "$RUNNER_TEMP/failures.log" || true
          hack/annotate.sh "Browser test failures on ${{ matrix.k8s }}" "$RUNNER_TEMP/failures.log" 14000
          hack/annotate.sh "Browser tests on ${{ matrix.k8s }}" bin/e2e/playwright.log 4000
          hack/annotate.sh "Cluster on ${{ matrix.k8s }}" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "e2e on ${{ matrix.k8s }}" "$RUNNER_TEMP/ci.log" 4000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.k8s }}
          path: web/playwright-report
          retention-days: 7

  scale:
    name: Scale (500 nodes, 15,000 pods)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser
        working-directory: web
        run: npm ci --no-fund && npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: bin
      - name: Load the image
        run: gunzip -c bin/image.tar.gz | docker load
      - name: Scale test with kwok
        run: IMAGE="$IMAGE:ci" hack/scale-kind.sh 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report
        if: failure()
        run: |
          hack/annotate.sh "Scale test" bin/e2e/scale.log 4000
          hack/annotate.sh "Scale cluster" bin/e2e/diagnostics.log 3000
          hack/annotate.sh "Scale" "$RUNNER_TEMP/ci.log" 4000

  publish:
    name: Publish image
    needs: [go, web, browsers, chart, image, e2e]
    # Main, and pull requests from this repository (not forks), so a pull
    # request can be tried on a test cluster before it merges; a run started
    # by hand publishes its branch as branch-<name>. Every job must
    # pass, except that a pull request's image is published when only the
    # browser tests failed (Firefox times out on page.goto in CI); main and
    # release tags still need them all.
    if: >-
      always() &&
      needs.go.result == 'success' && needs.web.result == 'success' && needs.chart.result == 'success' &&
      needs.image.result == 'success' && needs.e2e.result == 'success' &&
      (needs.browsers.result == 'success' || (github.event_name == 'pull_request' && needs.browsers.result == 'failure')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Container Registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push for linux/amd64 and linux/arm64
        env:
          PR: ${{ github.event.pull_request.number }}
          # For a pull request, its branch's commit rather than the merge commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p bin
          sha=${HEAD_SHA::12}
          if [ -n "$PR" ]; then
            version="pr-$PR"
            refs=("$IMAGE:pr-$PR" "$IMAGE:sha-$sha")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A release: v0.1.0 is published as 0.1.0, the chart's appVersion.
            version="${GITHUB_REF_NAME#v}"
            refs=("$IMAGE:$version")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="main-$sha"
            refs=("$IMAGE:main" "$IMAGE:sha-$sha")
          else
            # Run by hand on another branch: named after the branch, never
            # main. The prefix keeps it apart from main, pr-, sha- and
            # release tags; Docker allows [a-z0-9_.-] after it.
            branch="branch-$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | cut -c1-100)"
            version="$branch-$sha"
            refs=("$IMAGE:$branch" "$IMAGE:sha-$sha")
          fi
          tags=()
          for r in "${refs[@]}"; do tags+=(-t "$r"); done
          docker buildx create --name multi --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$version" --build-arg COMMIT="$sha" \
            --label org.opencontainers.image.revision="$HEAD_SHA" \
            "${tags[@]}" --push . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
          echo "::notice title=Published::${refs[*]}"
      - name: Report
        if: failure()
        run: hack/annotate.sh "Publish" "$RUNNER_TEMP/ci.log"
