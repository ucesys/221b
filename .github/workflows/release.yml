# A version tag (v0.7.0) makes a release (P7-08): the tag must match the
# chart's version and have a section in CHANGELOG.md; the chart is
# packaged and pushed to oci://ghcr.io/ucesys/charts, and a GitHub release
# is made with that section as its notes, the chart and the 221b command
# (TB-20, for macOS, Linux and Windows) attached. The image
# for the tag (ghcr.io/ucesys/221b:0.7.0) is built, tested and published by
# CI's publish job for the same tag, and this waits for it. The chart is
# signed with cosign, keyless, and has build provenance attested; the 221b
# command's checksums are signed, and the binaries have build provenance
# and an SBOM (#79). Nothing published is ever replaced. See
# docs/releasing.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: 'v4.3.0'
  GO_VERSION: '1.26.9'
  CHARTS: oci://ghcr.io/ucesys/charts

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: The tag, the chart and the changelog agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          chart=$(sed -n 's/^version: *//p' deploy/helm/221b/Chart.yaml)
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/221b/Chart.yaml)
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error::The tag $TAG is not the chart's version ($chart) and appVersion ($app). Bump deploy/helm/221b/Chart.yaml first (docs/releasing.md)."
            exit 1
          fi
          # The notes are the version's section of CHANGELOG.md, up to the next one.
          awk -v v="$version" '
            $0 ~ "^## " && found { exit }
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section \"## $version\". Move the Unreleased notes under it (docs/releasing.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for CI to publish the image
        # The image exists only when every gate of CI's run for this tag
        # passed, so nothing names an image that never comes. A failed run
        # can be rerun within the wait; past it, rerun this job.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          for _ in $(seq 240); do
            docker manifest inspect "ghcr.io/ucesys/221b:$VERSION" > /dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::ghcr.io/ucesys/221b:$VERSION was not published within two hours: CI's run for this tag has not passed."
          exit 1
      - name: Package and push the chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p bin "$RUNNER_TEMP/pushed"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          # A release's chart is never replaced: a rerun keeps the one pushed.
          if helm show chart "$CHARTS/221b" --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice title=Chart::$CHARTS/221b:$VERSION exists already and is kept as it is"
          else
            helm package deploy/helm/221b -d "$RUNNER_TEMP"
            helm push "$RUNNER_TEMP/221b-$VERSION.tgz" "$CHARTS"
            echo "::notice title=Chart::Pushed $CHARTS/221b:$VERSION"
          fi
          # What is attached, signed and attested is what the registry holds.
          helm pull "$CHARTS/221b" --version "$VERSION" -d "$RUNNER_TEMP/pushed" 2>&1 | tee "$RUNNER_TEMP/pull.log"
          cp "$RUNNER_TEMP/pushed/221b-$VERSION.tgz" bin/
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' "$RUNNER_TEMP/pull.log" | head -1)
          [[ "$digest" == sha256:* ]] || { echo "::error::No digest for $CHARTS/221b:$VERSION"; exit 1; }
          helm registry logout ghcr.io
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the chart
        # Keyless: the certificate names this workflow and the tag, and the
        # signature is logged in Sigstore's transparency log.
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          cosign sign --yes "ghcr.io/ucesys/charts/221b@$DIGEST"
      - name: The chart's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ucesys/charts/221b
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true
      - name: Build the 221b command
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make cli-release VERSION="$TAG"
          (cd bin/cli && sha256sum 221b-* > SHA256SUMS)
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: bin/cli
          format: spdx-json
          output-file: bin/sbom-221b-command.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: The 221b command's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/cli/221b-*
            bin/221b-*.tgz
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle bin/cli/SHA256SUMS.sigstore.json bin/cli/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "helm upgrade --install k8s-console $CHARTS/221b --version $VERSION -n 221b --create-namespace"
            echo '```'
            echo
            echo "The \`221b\` command for port forwards (macOS, Linux, Windows) is attached: rename it to \`221b\` and put it on your PATH."
            echo
            echo "The image is \`ghcr.io/ucesys/221b:$VERSION\`. Upgrading from an earlier release: [docs/upgrading.md](https://github.com/${{ github.repository }}/blob/$TAG/docs/upgrading.md)."
            echo
            echo "The image and the chart are signed with cosign, keyless, and carry build provenance (and the image an SBOM); the command's \`SHA256SUMS\` is signed, with its bundle attached. How to check them: [docs/releasing.md](https://github.com/${{ github.repository }}/blob/$TAG/docs/releasing.md#verify-a-release)."
          } > "$RUNNER_TEMP/release.md"
          gh release create "$TAG" "bin/221b-$VERSION.tgz" bin/cli/* bin/sbom-221b-command.spdx.json --repo "${{ github.repository }}" --title "221B $VERSION" --notes-file "$RUNNER_TEMP/release.md" --verify-tag
