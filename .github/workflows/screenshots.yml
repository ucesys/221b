# Takes the README's screenshots (docs/screenshots) against the simulated
# cluster, so they show sample data only, and commits them to the branch.
# Runs when the screenshot script changes on a branch, or by hand, never on
# main. The screenshots are taken with a read-only token, since npm packages
# run code there; only the last job, which runs nothing from the branch's
# dependencies, may push.
name: Screenshots

on:
  push:
    branches-ignore: [main]
    paths:
      - web/screenshots/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.9'
  NODE_VERSION: '24'

jobs:
  screenshots:
    name: Screenshots
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser
        working-directory: web
        run: npm ci --no-fund && npx playwright install --with-deps chromium
      - name: Take the screenshots
        id: shots
        continue-on-error: true
        run: make screenshots 2>&1 | tee "$RUNNER_TEMP/shots.log"; exit "${PIPESTATUS[0]}"
      - name: Keep them
        if: steps.shots.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: docs/screenshots
          retention-days: 1
      - name: Report
        if: steps.shots.outcome == 'failure'
        run: |
          hack/annotate.sh "Screenshots" "$RUNNER_TEMP/shots.log" 8000
          hack/annotate.sh "Server log" bin/shots-server.log 2000
          exit 1

  commit:
    name: Commit the screenshots
    needs: screenshots
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: docs/screenshots
      - name: Commit them
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'docs: refresh the README screenshots' -m "Taken by the Screenshots workflow from ${GITHUB_SHA::7} against the simulated cluster."
          # The token goes to this one push, not to the checkout on disk.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
