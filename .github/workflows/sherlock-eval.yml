# Sherlock's evaluation (P5-06), nightly: the simulator's sample problems
# (a pending pod, a failed Helm upgrade, a drain blocked by a budget, a
# LoadBalancer without an address and six more), each asked of Sherlock
# through the Claude API and graded by the facts the answer must name. It
# fails below 9 of 10. It needs the repository secret ANTHROPIC_API_KEY;
# without it the run checks the plumbing against the simulator's fake API.
name: Sherlock evaluation

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      model:
        description: Claude model to evaluate
        default: claude-opus-5-5

permissions:
  contents: read

concurrency:
  group: sherlock-eval
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: '1.26.9'

jobs:
  eval:
    name: Sherlock evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Ask Sherlock about each sample problem
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
        run: hack/sherlock-eval.sh
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sherlock-eval
          path: |
            bin/sherlock-eval.md
            bin/sherlock-eval.json
          if-no-files-found: ignore
          retention-days: 30
